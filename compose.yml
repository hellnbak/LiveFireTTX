services:
  livefirettx:
    build: .
    ports:
      - "127.0.0.1:${LIVEFIRE_APP_HOST_PORT:-8000}:8000"
    environment:
      LIVEFIRE_ALLOW_CONTAINER_HOST: "true"
      LIVEFIRE_CONTROL_URL: "http://host.docker.internal:${LIVEFIRE_CONTROL_HOST_PORT:-8090}"
      LIVEFIRE_LAB_CONTROLS_ENABLED: "false"
      LIVEFIRE_SCHEDULER_ENABLED: "${LIVEFIRE_SCHEDULER_ENABLED:-true}"
      LIVEFIRE_SCHEDULER_INTERVAL_SECONDS: "${LIVEFIRE_SCHEDULER_INTERVAL_SECONDS:-2}"
      LIVEFIRE_SHARED_MODE: "${LIVEFIRE_SHARED_MODE:-false}"
      LIVEFIRE_ALLOWED_HOSTS: "${LIVEFIRE_ALLOWED_HOSTS:-127.0.0.1,localhost,[::1],testserver}"
      LIVEFIRE_SESSION_TTL_MINUTES: "${LIVEFIRE_SESSION_TTL_MINUTES:-480}"
      LIVEFIRE_SECURE_COOKIES: "${LIVEFIRE_SECURE_COOKIES:-true}"
      LIVEFIRE_BOOTSTRAP_ADMIN_USERNAME: "${LIVEFIRE_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      LIVEFIRE_BOOTSTRAP_ADMIN_PASSWORD: "${LIVEFIRE_BOOTSTRAP_ADMIN_PASSWORD:-}"
      LIVEFIRE_EVIDENCE_RETENTION_DAYS: "${LIVEFIRE_EVIDENCE_RETENTION_DAYS:-365}"
      LIVEFIRE_EVIDENCE_RETENTION_COUNT: "${LIVEFIRE_EVIDENCE_RETENTION_COUNT:-25}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - livefirettx-data:/data
    restart: unless-stopped

volumes:
  livefirettx-data:
